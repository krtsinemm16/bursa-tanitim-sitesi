<h1>Tahinli Pide</h1>

<p>
Tahinli Pide, Bursa'nın geleneksel hamur işlerinden biridir.
</p>

<h2>Nasıl Yapılır?</h2>

<p>
İnce açılan hamurun içerisine tahin ve şeker karışımı sürülerek pişirilir.
</p>

<h2>Neden Sevilir?</h2>

<p>
Tatlı ve tahinin uyumunu sevenler için eşsiz bir lezzettir.
</p>
