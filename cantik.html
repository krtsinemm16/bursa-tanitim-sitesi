<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cantık</title>

<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0}
.container{width:80%;margin:auto;padding:50px 20px}
.box{background:white;padding:30px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
h1,h2{color:green}
p{font-size:18px;line-height:1.8}
</style>
</head>
<body>
<div class="container">
<div class="box">

<h1>Cantık</h1>

<p>
Cantık, Bursa'ya özgü bir pide çeşididir.
</p>

<h2>Nasıl Yapılır?</h2>

<p>
Yuvarlak hamurun üzerine kıymalı harç konularak taş fırında pişirilir.
</p>

<h2>Neden Sevilir?</h2>

<p>
Lezzetli kıyması ve çıtır hamuruyla Bursa'nın vazgeçilmez yemeklerinden biridir.
</p>

</div>
</div>
</body>
</html>
